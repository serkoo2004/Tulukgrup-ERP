services:
  postgres:
    image: postgres:16-alpine
    container_name: tuluklar-postgres
    environment:
      POSTGRES_DB: tuluklar_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d tuluklar_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tuluklar-redis
    ports:
      - "127.0.0.1:6379:6379"

  nats:
    image: nats:2-alpine
    container_name: tuluklar-nats
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tuluklar-backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://erp_user:erp_password@postgres:5432/tuluklar_erp
      STORAGE_ROOT: /app/storage
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-not-configured}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_BUSINESS_API_URL: ${WHATSAPP_BUSINESS_API_URL:-https://graph.facebook.com/v20.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-tr}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage

  realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    container_name: tuluklar-realtime
    env_file: .env
    environment:
      NATS_URL: nats://nats:4222
      REALTIME_HOST: 0.0.0.0
    depends_on:
      - nats
    ports:
      - "8090:8090"
      - "7070:7070"

  nginx:
    image: nginx:1.27-alpine
    container_name: tuluklar-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - realtime
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_storage:
